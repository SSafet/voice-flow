<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>VoiceFlow — Concept E: Orbit Island</title>
<link rel="stylesheet" href="film.css">
</head>
<body>
<div id="stage">
  <div id="wallpaper"></div>
  <div id="menubar"></div>
  <div id="windows"></div>
  <div id="cc">
    <div id="cc-dim"></div>
    <canvas id="fxBack" width="1920" height="1080"></canvas>
    <div id="cc-titles"></div>
    <div id="cc-nodes"></div>
    <div id="cc-orbit"></div>
    <div id="cc-resolved"></div>
    <div id="cc-rail" class="glass"></div>
  </div>
  <div id="tdrop"></div>
  <div id="drop"></div>
  <div id="island">
    <svg id="isl-shape" width="1920" height="640" xmlns="http://www.w3.org/2000/svg"><path id="isl-sheet"/><path id="isl-black"/></svg>
    <div id="isl-in">
      <div class="band">
        <div class="b-left"></div>
        <div class="b-right"></div>
        <div class="pips"></div>
      </div>
      <div class="body">
        <div id="dict"><div class="d-flow"></div></div>
        <div id="think"></div>
        <div id="reader"><div class="r-clip"><div class="r-col"></div></div></div>
        <div id="rec"><div class="rec-flow"></div></div>
        <div id="sheet"></div>
      </div>
    </div>
  </div>
  <canvas id="fx" width="1920" height="1080"></canvas>
  <div id="ripple"></div>
  <div id="cursor"><svg width="24" height="30" viewBox="0 0 24 30"><path d="M4 2 L4 24 L9.5 19 L13 27.5 L16.5 26 L13 17.5 L20 17.5 Z" fill="#000" stroke="#fff" stroke-width="1.6" stroke-linejoin="round"/></svg></div>
  <div id="hud"></div>
  <div id="caption"><div class="cap-l"></div><div class="cap-s"></div></div>
  <div id="title"></div>
  <div id="endcard"></div>
</div>
<script src="../shared/data.js"></script>
<script src="../shared/kit.js"></script>
<script src="timeline.js"></script>
<script src="desktop.js"></script>
<script src="orbit.js"></script>
<script src="island.js"></script>
<script src="payload.js"></script>
<script src="constellation.js"></script>
<script src="capture.js"></script>
<script src="film.js"></script>
</body>
</html>
